[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-contrib-myfirstplugin"
version = "0.1.0"
description = "A custom Tutor plugin for Open edX theme management"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tutor>=19,<20"
]
keywords = [
    "tutor",
    "openedx",
    "theme-management",
    "indigo",
    "pink"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "Operating System :: OS Independent"
]

[project.entry-points."tutor.plugin.v1"]
myfirstplugin = "myfirstplugin.plugin"

[tool.setuptools.packages.find]
include = ["myfirstplugin*"]
